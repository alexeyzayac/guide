---

apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: app
  labels:
    app: web
    env: prod
spec:
  initContainers:
  - name: init-content
    image: busybox:1.36
    command: ["sh", "-c", "echo '<h1>Hello from init</h1>' > /work/index.html"]
    volumeMounts:
    - name: content
      mountPath: /work

  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
    volumeMounts:
    - name: content
      mountPath: /usr/share/nginx/html

  volumes:
  - name: content
    emptyDir: {}

...
